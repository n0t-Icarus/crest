<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Crest</title>
    <style>
      /*
       * Pre-paint values so the window is never white while the theme loads.
       * They read the theme tokens with a dark fallback: a hardcoded light
       * `color` here outranks `body { color: var(--text-1) }` (an id beats a
       * type selector), which left every inheriting heading white-on-white in
       * the Glacier theme.
       */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: var(--canvas, #06070a);
        color: var(--text-1, #f2f3f5);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
